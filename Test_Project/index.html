<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe — Z vs 3</title>
  <style>
    :root {
      --z-color: #00f0ff;     /* electric cyan */
      --three-color: #ff2e9a; /* hot magenta */
      --win: #aaff00;         /* acid lime */
      --text: #f5f0ff;
      --muted: #b18cff;
      --tile: #2a0a4a;
      --tile-top: #3d1370;
      --edge: #12042a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 18%, #3a0d63 0%, transparent 55%),
        linear-gradient(160deg, #1a0033 0%, #0a0118 55%, #2d0036 100%);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      padding: 24px;
      overflow-x: hidden;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--z-color), var(--three-color), #ffe600);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 14px rgba(255, 46, 154, 0.55));
    }

    .subtitle {
      color: var(--muted);
      margin: 0 0 20px;
      font-size: 0.95rem;
      letter-spacing: 0.03em;
    }

    .status {
      font-size: 1.3rem;
      font-weight: 700;
      min-height: 1.6em;
      margin-bottom: 22px;
      text-align: center;
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.45);
    }

    /* 3D stage: tilt the board back in space */
    .board-stage {
      perspective: 900px;
      perspective-origin: 50% 30%;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-template-rows: repeat(3, 100px);
      gap: 12px;
      padding: 16px;
      border-radius: 18px;
      background: linear-gradient(145deg, #2b0a52, #150129);
      transform: rotateX(26deg) rotateZ(-2deg);
      transform-style: preserve-3d;
      box-shadow:
        0 40px 60px -20px rgba(0, 0, 0, 0.75),
        0 0 40px rgba(177, 140, 255, 0.25);
      border: 1px solid rgba(177, 140, 255, 0.25);
    }

    .cell {
      position: relative;
      background: linear-gradient(160deg, var(--tile-top), var(--tile));
      border: none;
      border-radius: 12px;
      font-size: 3.2rem;
      font-weight: 800;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      font-family: inherit;
      /* raised-tile depth: dark base edge + inner highlight */
      box-shadow:
        0 8px 0 var(--edge),
        0 10px 14px rgba(0, 0, 0, 0.5),
        inset 0 2px 2px rgba(255, 255, 255, 0.12);
    }

    .cell:hover:not(:disabled):empty {
      transform: translateZ(14px);
      box-shadow:
        0 14px 0 var(--edge),
        0 18px 22px rgba(0, 0, 0, 0.55),
        inset 0 2px 2px rgba(255, 255, 255, 0.18),
        0 0 24px rgba(0, 240, 255, 0.35);
    }

    .cell:active:not(:disabled) {
      transform: translateZ(2px);
      box-shadow:
        0 4px 0 var(--edge),
        0 6px 10px rgba(0, 0, 0, 0.5),
        inset 0 2px 2px rgba(255, 255, 255, 0.1);
    }

    .cell:disabled {
      cursor: default;
    }

    .cell.z {
      color: var(--z-color);
      text-shadow: 0 0 10px var(--z-color), 0 0 22px var(--z-color);
    }
    .cell.three {
      color: var(--three-color);
      text-shadow: 0 0 10px var(--three-color), 0 0 22px var(--three-color);
    }

    .cell.win {
      background: linear-gradient(160deg, #6fdc00, #3e8a00);
      color: #0c1a00;
      text-shadow: none;
      box-shadow:
        0 8px 0 #1f3d00,
        0 10px 16px rgba(0, 0, 0, 0.5),
        inset 0 2px 2px rgba(255, 255, 255, 0.3),
        0 0 30px var(--win);
      animation: winPulse 0.8s ease-in-out infinite alternate;
    }

    @keyframes winPulse {
      from { filter: brightness(1); }
      to   { filter: brightness(1.35); }
    }

    .scoreboard {
      display: flex;
      gap: 12px;
      margin-bottom: 22px;
    }

    .score {
      background: rgba(42, 10, 74, 0.7);
      border: 1px solid rgba(177, 140, 255, 0.3);
      border-radius: 12px;
      padding: 10px 18px;
      text-align: center;
      min-width: 84px;
      backdrop-filter: blur(4px);
    }

    .score .label {
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .score .value {
      font-size: 1.6rem;
      font-weight: 800;
      margin-top: 2px;
    }

    .score.you .value {
      color: var(--z-color);
      text-shadow: 0 0 10px var(--z-color);
    }
    .score.cpu .value {
      color: var(--three-color);
      text-shadow: 0 0 10px var(--three-color);
    }
    .score.draws .value {
      color: #ffe600;
      text-shadow: 0 0 10px #ffe600;
    }

    .controls {
      margin-top: 40px;
      display: flex;
      gap: 12px;
    }

    .reset-scores {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--muted);
      padding: 11px 20px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
      transition: color 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
    }

    .reset-scores:hover {
      color: var(--text);
      border-color: var(--text);
      box-shadow: 0 0 16px rgba(177, 140, 255, 0.5);
    }
    .reset-scores:active { transform: scale(0.97); }

    .new-game {
      background: linear-gradient(90deg, var(--z-color), var(--three-color));
      color: #11001a;
      border: none;
      padding: 11px 26px;
      font-size: 1rem;
      font-weight: 800;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 0.03em;
      box-shadow: 0 0 18px rgba(255, 46, 154, 0.5);
      transition: filter 0.12s ease, box-shadow 0.12s ease;
    }

    .new-game:hover {
      filter: brightness(1.12);
      box-shadow: 0 0 26px rgba(0, 240, 255, 0.6);
    }
    .new-game:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <h1>Tic-Tac-Toe</h1>
  <p class="subtitle">You are <strong>Z</strong> &nbsp;•&nbsp; Computer is <strong>3</strong></p>

  <div class="scoreboard">
    <div class="score you">
      <div class="label">You (Z)</div>
      <div class="value" id="scoreYou">0</div>
    </div>
    <div class="score draws">
      <div class="label">Draws</div>
      <div class="value" id="scoreDraws">0</div>
    </div>
    <div class="score cpu">
      <div class="label">CPU (3)</div>
      <div class="value" id="scoreCpu">0</div>
    </div>
  </div>

  <div class="status" id="status">Your turn (Z)</div>

  <div class="board-stage">
    <div class="board" id="board"></div>
  </div>

  <div class="controls">
    <button class="new-game" id="newGame">New Game</button>
    <button class="reset-scores" id="resetScores">Reset Scores</button>
  </div>

  <script>
    const PLAYER = "Z";
    const COMPUTER = "3";

    const WIN_LINES = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8], // rows
      [0, 3, 6], [1, 4, 7], [2, 5, 8], // columns
      [0, 4, 8], [2, 4, 6]             // diagonals
    ];

    const boardEl = document.getElementById("board");
    const statusEl = document.getElementById("status");
    const newGameBtn = document.getElementById("newGame");
    const resetScoresBtn = document.getElementById("resetScores");
    const scoreEls = {
      you: document.getElementById("scoreYou"),
      draws: document.getElementById("scoreDraws"),
      cpu: document.getElementById("scoreCpu")
    };

    let board = Array(9).fill("");
    let gameOver = false;
    let cells = [];
    let scores = { you: 0, draws: 0, cpu: 0 };

    function renderScores() {
      scoreEls.you.textContent = scores.you;
      scoreEls.draws.textContent = scores.draws;
      scoreEls.cpu.textContent = scores.cpu;
    }

    function buildBoard() {
      boardEl.innerHTML = "";
      cells = [];
      for (let i = 0; i < 9; i++) {
        const btn = document.createElement("button");
        btn.className = "cell";
        btn.dataset.index = i;
        btn.addEventListener("click", () => handlePlayerMove(i));
        boardEl.appendChild(btn);
        cells.push(btn);
      }
    }

    function render() {
      board.forEach((mark, i) => {
        const cell = cells[i];
        cell.textContent = mark;
        cell.classList.toggle("z", mark === PLAYER);
        cell.classList.toggle("three", mark === COMPUTER);
        cell.disabled = mark !== "" || gameOver;
      });
    }

    // Returns the winning line array for `mark`, or null.
    function findWinningLine(mark, state) {
      for (const line of WIN_LINES) {
        if (line.every(idx => state[idx] === mark)) return line;
      }
      return null;
    }

    function isFull(state) {
      return state.every(cell => cell !== "");
    }

    function handlePlayerMove(i) {
      if (gameOver || board[i] !== "") return;
      board[i] = PLAYER;
      render();

      if (checkEnd(PLAYER, "You win! 🎉")) return;

      statusEl.textContent = "Computer thinking…";
      // Small delay so the computer's move feels natural.
      setTimeout(computerMove, 350);
    }

    function computerMove() {
      if (gameOver) return;
      const move = chooseComputerMove();
      if (move === -1) return;
      board[move] = COMPUTER;
      render();

      if (checkEnd(COMPUTER, "Computer wins!")) return;
      statusEl.textContent = "Your turn (Z)";
    }

    // Heuristic: win > block > center > random.
    function chooseComputerMove() {
      const empty = board
        .map((mark, i) => (mark === "" ? i : -1))
        .filter(i => i !== -1);

      // 1. Win if possible.
      for (const i of empty) {
        const test = board.slice();
        test[i] = COMPUTER;
        if (findWinningLine(COMPUTER, test)) return i;
      }
      // 2. Block the player's winning move.
      for (const i of empty) {
        const test = board.slice();
        test[i] = PLAYER;
        if (findWinningLine(PLAYER, test)) return i;
      }
      // 3. Take the center.
      if (board[4] === "") return 4;
      // 4. Random available cell.
      if (empty.length === 0) return -1;
      return empty[Math.floor(Math.random() * empty.length)];
    }

    // Ends the game if `mark` just won or the board is full. Returns true if ended.
    function checkEnd(mark, winMessage) {
      const winLine = findWinningLine(mark, board);
      if (winLine) {
        gameOver = true;
        winLine.forEach(idx => cells[idx].classList.add("win"));
        statusEl.textContent = winMessage;
        scores[mark === PLAYER ? "you" : "cpu"]++;
        renderScores();
        render();
        return true;
      }
      if (isFull(board)) {
        gameOver = true;
        statusEl.textContent = "It's a draw!";
        scores.draws++;
        renderScores();
        render();
        return true;
      }
      return false;
    }

    function newGame() {
      board = Array(9).fill("");
      gameOver = false;
      cells.forEach(cell => cell.classList.remove("win"));
      statusEl.textContent = "Your turn (Z)";
      render();
    }

    function resetScores() {
      scores = { you: 0, draws: 0, cpu: 0 };
      renderScores();
    }

    newGameBtn.addEventListener("click", newGame);
    resetScoresBtn.addEventListener("click", resetScores);

    buildBoard();
    render();
    renderScores();
  </script>
</body>
</html>
